name: pipeline

# Continuous, incremental Duval ingestion: every 6 hours and on demand. Each run downloads only
# sources whose ETag/Last-Modified changed, merges by row hash (inserted/updated/unchanged deltas),
# rebuilds the query table, records the run in runs/<run_id>.json (committed back) and, when the
# Filebase secrets exist, re-publishes the artifacts to IPFS and re-points the IPNS names.
# The scheduled run executes ALL tracks: the FDOR/JTA/NHD/Overture/Sunbiz tracks run anywhere; the
# COJ / DBPR / JaxEPICS tracks need a US egress (GitHub runners are US) and self-skip elsewhere.
#
# Everything this workflow learns about a run - which CI event started it, where each track's cursor
# ended up, and how the table totals compare with the largest they have ever been - is committed
# back under runs/. The DuckDB working set lives in a branch-scoped Actions cache that GitHub
# evicts, so runs/ is the only durable record and it has to be able to answer "is the cron actually
# running" and "did a table just shrink" on its own.
#
# "Is the cron running" is answered by runs/ci-runs.json, which is DERIVED from the Actions API and
# not accumulated. Accumulating cannot work here: the ledger did not exist when the first scheduled
# run landed, and the file is committed to a branch this project force-pushes over, so a tally could
# be reset to zero by a git operation rather than by reality. The reconcile step below re-reads the
# API every run, so the file states what GitHub says happened whatever the branch has been through.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tracks:
        description: "Comma-separated tracks, or default (all) | local (no US-only tracks)"
        required: false
        default: "default"
      window:
        description: "Window for windowed tracks: Sunbiz days (e.g. 14d) or permit count (e.g. 300)"
        required: false
        default: ""
      publish:
        description: "Upload to Filebase + re-point IPNS (requires secrets)"
        required: false
        default: "true"
      allow_regression:
        description: "Accept and record table totals that went backwards (use after a deliberate rebuild)"
        required: false
        default: "false"
      regression_note:
        description: "Why the regression is expected; recorded in runs/table-highwater.json"
        required: false
        default: ""

concurrency:
  group: duval-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  # The reconcile step lists this workflow's own runs to rebuild runs/ci-runs.json. Naming any
  # permission here sets every unnamed one to none, so this line is what makes that call possible.
  actions: read

env:
  DATA_DIR: ${{ github.workspace }}/.data
  NODE_OPTIONS: --max-old-space-size=6144
  SUNBIZ_WINDOW_DAYS: "14"
  PERMITS_WINDOW: "300"
  PA_DETAIL_WINDOW: "300"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: One cache lineage
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
        working-directory: ${{ github.workspace }}
        run: |
          echo "::warning title=Second cache lineage::Actions caches are branch scoped. Running the pipeline on '${{ github.ref_name }}' builds a working set that the scheduled run on '${{ github.event.repository.default_branch }}' can never read, and vice versa. That is how pa_detail_buildings went from 1619 rows to 466. Prefer dispatching this workflow on the default branch."

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Restore source artifacts + DuckDB from the previous run
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          # one stable path entry: GitHub derives the cache version from the path list, so a changed
          # list would orphan every earlier cache (restore-keys cannot cross versions)
          path: .data
          key: duval-data-${{ github.run_id }}
          restore-keys: |
            duval-data-

      - name: Warm or cold start
        id: warmth
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f .data/duval.duckdb ]; then
            echo "cold=false" >> "$GITHUB_OUTPUT"
            echo "warm start: $(du -h .data/duval.duckdb | cut -f1) working set from cache key '${{ steps.data-cache.outputs.cache-matched-key }}'"
          else
            echo "cold=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cold start::No DuckDB in the restored cache, so every accumulating track restarts from cursor zero and the table totals will be far below their high-water marks. The run will stop at the high-water gate before it publishes anything. Re-run once a warm cache exists, or dispatch with allow_regression=true and a regression_note to re-base the marks deliberately."
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # Verification is REPORTED here and ENFORCED at the publish gate further down, rather than
      # blocking the ingest steps between the two.
      #
      # Ingesting is not publishing. The working set these steps guard is a branch-scoped Actions
      # cache that nothing outside this runner can read, and the next tick merges on from wherever
      # this one leaves the cursors, so a bad ingest is recoverable by ingesting again. A publish is
      # not recoverable in the same way: it re-points IPNS names that the hosted runtime and the MCP
      # read, so a bad artifact is live until someone notices.
      #
      # Ordering the suite in front of ingestion cost a whole tick of county data at
      # 2026-08-22T00:28Z: test/run-log-rehydrate.test.ts failed 16 seconds in, and a test about how
      # run records are rehydrated skipped 42 minutes of source downloads, the consolidation export
      # and the publish. Nothing about county data was broken that night.
      #
      # Running them first anyway, with the failure carried forward, keeps the fail-fast signal: the
      # annotation is on screen two minutes into the tick, while the data still lands behind it.
      # ci.yml runs the same suite plus the linter on every push, so this is the second reading of
      # it, not the only one.
      - name: Typecheck (reported now, enforced at the publish gate)
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - name: Unit tests (reported now, enforced at the publish gate)
        id: unit
        continue-on-error: true
        run: pnpm test

      - name: Egress check (COJ / DBPR / JaxEPICS answer only from US IPs; FDOR, JTA, NHD, Overture, Sunbiz do not care)
        run: curl -s --max-time 10 https://ipinfo.io/json | head -c 300; echo

      - name: Run pipeline (all tracks)
        env:
          # github.event_name is `schedule` on a cron tick, and the CLI records it verbatim in
          # runs/<run_id>.json and in the `runs` layer of runs/ci-runs.json. Do not replace it with
          # a literal. The `workflow_runs` layer of that file comes from the API instead, so the two
          # can be compared: they should agree about every run this clone actually executed.
          TRACKS: ${{ github.event.inputs.tracks || 'default' }}
          WINDOW: ${{ github.event.inputs.window || '' }}
          ALLOW_REGRESSION: ${{ github.event.inputs.allow_regression || 'false' }}
          REGRESSION_NOTE: ${{ github.event.inputs.regression_note || '' }}
        run: |
          ARGS="--tracks $TRACKS --trigger ${{ github.event_name }}"
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window $WINDOW"; fi
          if [ "$ALLOW_REGRESSION" = "true" ]; then ARGS="$ARGS --allow-regression"; fi
          if [ -n "$REGRESSION_NOTE" ]; then
            pnpm run pipeline -- $ARGS --regression-note "$REGRESSION_NOTE"
          else
            pnpm run pipeline -- $ARGS
          fi

      # The enforcement half of the two steps above. It only exists when it has something to say, so
      # everything after it is skipped by ordinary step semantics and needs no condition of its own.
      # Failing here still leaves the county data ingested and cached, the run recorded, and the
      # IPNS names resolving to the last artifact that passed.
      - name: Publish gate (a build that failed verification does not publish)
        if: ${{ steps.typecheck.outcome != 'success' || steps.unit.outcome != 'success' }}
        run: |
          echo "::error title=Verification failed, publish withheld::typecheck=${{ steps.typecheck.outcome }} unit=${{ steps.unit.outcome }}. This tick's county data is ingested and saved to the cache, and the published artifacts are untouched. Fix the build, then dispatch this workflow on the default branch to publish."
          exit 1

      - name: Export open-data consolidation (changed properties only; rebuilds shards/index/manifest)
        # This pass rewrites query-table.parquet, so it applies the SAME validation gate as the run
        # above and exits non-zero when the gate fails. A failed gate leaves the previous parquet in
        # place and stops the job before the publish step below.
        run: pnpm run export:consolidation -- --since changed --shard-size 10000

      - name: Publish to Filebase / IPFS (dry-run when secrets are absent)
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET_DUVAL: ${{ secrets.FILEBASE_BUCKET_DUVAL }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [ -n "$FILEBASE_ACCESS_KEY" ] && [ "$PUBLISH" = "true" ]; then
            # Artifacts FIRST. These ~10 objects are what the hosted runtime and the MCP read, and
            # they publish in a couple of minutes. The open-data set is 404k objects and takes
            # hours; publishing it first left the runtime serving stale data behind a bulk upload
            # it does not consume. It also must not be able to fail the artifact publish, so it
            # runs after and its failure is reported without failing the step.
            pnpm run publish:ipfs -- --publish
            pnpm run publish:open-data -- --publish || echo "::warning::open-data publish failed; artifacts above are published and the runtime is unaffected"
          else
            echo "Filebase secrets not configured (or publish=false): dry-run only"
            pnpm run publish:open-data
            pnpm run publish:ipfs
          fi

      - name: Reconcile the CI run ledger against the GitHub Actions API
        # Always, and last. A cron tick that FAILED is the tick a reader most needs to see, and the
        # pipeline command never reaches its own recording step when it fails. Running here also
        # means this very workflow run reports itself (as in_progress), and that the ledger the
        # commit step pushes is the reconciled one rather than the appended one.
        #
        # This never fails the job: an API it could not read is recorded in the file as an outcome,
        # which is visible and honest, where a red run would only hide the evidence it collects.
        if: always()
        # Belt and braces for the sentence above: the script handles every API failure itself, and
        # this covers the case where an earlier failure meant `pnpm install` never ran, so the
        # runner cannot start it at all.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx src/publish/reconcileCi.ts

      - name: Save source artifacts + DuckDB for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          # one stable path entry: GitHub derives the cache version from the path list, so a changed
          # list would orphan every earlier cache (restore-keys cannot cross versions)
          path: .data
          key: duval-data-${{ github.run_id }}

      - name: Upload publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duval-publish-${{ github.run_id }}
          # List the wanted files explicitly and never glob the publish root. upload-artifact walks
          # the include patterns before it applies exclusions, so `publish/duval/` + `!.../properties/**`
          # still enumerated all 404k per-property files and died with "Maximum call stack size
          # exceeded" (twice: runs 32466876779 and 32469673797). Nothing here recurses into open-data.
          # Those per-property files are addressed by CID on IPFS; they were never a build artifact.
          #
          # runs/ is included so this run's record survives even when the commit-back below cannot
          # land it (a force-push to the branch destroyed run 32513420281's record, which was the
          # only committed proof that the cron had ever fired).
          path: |
            .data/artifacts/publish/duval/*.json
            .data/artifacts/publish/duval/*.txt
            .data/artifacts/publish/duval/*.parquet
            .data/artifacts/publish/duval/tables/*.parquet
            .data/artifacts/publish/duval/open-data/index.json
            .data/artifacts/publish/duval/open-data/manifest.json
            .data/artifacts/publish/duval/open-data/export-summary.json
            .data/artifacts/publish/duval/open-data/publish-result.json
            .data/artifacts/permits/discovered-api.json
            runs/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit run history
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "duval-oracle-pipeline[bot]"
          git config user.email "pipeline@users.noreply.github.com"
          mkdir -p runs
          cp .data/artifacts/publish/duval/publish-manifest.json runs/latest-publish-manifest.json 2>/dev/null || true
          cp .data/artifacts/publish/duval/mcp-env.txt runs/latest-mcp-env.txt 2>/dev/null || true
          cp .data/artifacts/publish/duval/dataset-coverage.json runs/latest-dataset-coverage.json 2>/dev/null || true
          cp .data/artifacts/permits/discovered-api.json runs/latest-jaxepics-api.json 2>/dev/null || true
          git add runs/
          if git diff --cached --quiet; then echo "no run history changes"; exit 0; fi
          git commit -m "pipeline: run history $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Push with retry. The previous "commit, pull --rebase, push once" lost the record of the
          # only scheduled run we had: another push landed on the branch in the same window and the
          # single attempt did not survive it. Rebase onto whatever is there now and try again.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "run history pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}; rebasing onto the current ${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "::error title=Run history not committed::Could not push runs/ after 5 attempts. This run's record exists only in the workflow artifact duval-publish-${{ github.run_id }}."
          exit 1

  alert:
    name: Alert on a failed scheduled run
    needs: run
    # Only the cron. A dispatched run has a human watching it; a cron failing at 03:17 does not.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the pipeline-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          {
            echo "The 6-hourly Duval ingestion run failed."
            echo ""
            echo "- run: ${RUN_URL}"
            echo "- attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo ""
            echo "Continuous ingestion is the claim this repository is built on, so a failed cron is"
            echo "a broken promise rather than a red tick. Open the run, find the failing step, and"
            echo "re-dispatch the workflow once it is fixed."
            echo ""
            echo "Common causes, in the order they have actually happened here:"
            echo "1. typecheck or the unit suite failed, so the publish gate withheld the publish."
            echo "   This tick's county data IS ingested and cached and the previously published"
            echo "   artifacts are untouched, so the cost is one skipped publish, not a lost tick;"
            echo "2. the validation or high-water gate stopped the run because it started from a cold cache;"
            echo "3. a county portal blocked the runner (anti-bot or geo-block) and a track failed;"
            echo "4. an IPNS name did not move and the publish command exited non-zero."
          } > alert-body.md
          gh label create pipeline-failure --color B60205 --description "A scheduled pipeline run failed" >/dev/null 2>&1 || true
          EXISTING="$(gh issue list --state open --label pipeline-failure --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file alert-body.md || echo "::error title=Alerting failed::Scheduled run FAILED and the failure issue could not be updated: ${RUN_URL}"
          else
            gh issue create --title "Scheduled pipeline run failed" --label pipeline-failure --body-file alert-body.md \
              || gh issue create --title "Scheduled pipeline run failed" --body-file alert-body.md \
              || echo "::error title=Alerting failed::Scheduled run FAILED and no issue could be opened (are Issues enabled on this repository?): ${RUN_URL}"
          fi
          # Optional second channel, zero cost when the secret is not set.
          if [ -n "${ALERT_WEBHOOK_URL}" ]; then
            jq -n --arg text "Duval pipeline: scheduled run FAILED - ${RUN_URL}" '{text: $text}' \
              | curl -s -X POST -H "Content-Type: application/json" --data @- "${ALERT_WEBHOOK_URL}" >/dev/null || true
          fi
          {
            echo "## Scheduled pipeline run failed"
            echo ""
            cat alert-body.md
          } >> "${GITHUB_STEP_SUMMARY}"
