name: pipeline

# Continuous, incremental Duval ingestion: every 6 hours and on demand. Each run downloads only
# sources whose ETag/Last-Modified changed, merges by row hash (inserted/updated/unchanged deltas),
# rebuilds the query table, records the run in runs/<run_id>.json (committed back) and, when the
# Filebase secrets exist, re-publishes the artifacts to IPFS and re-points the IPNS names.
# The scheduled run executes ALL tracks: the FDOR/JTA/NHD/Overture/Sunbiz tracks run anywhere; the
# COJ / DBPR / JaxEPICS tracks need a US egress (GitHub runners are US) and self-skip elsewhere.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tracks:
        description: "Comma-separated tracks, or default (all) | local (no US-only tracks)"
        required: false
        default: "default"
      window:
        description: "Window for windowed tracks: Sunbiz days (e.g. 14d) or permit count (e.g. 300)"
        required: false
        default: ""
      publish:
        description: "Upload to Filebase + re-point IPNS (requires secrets)"
        required: false
        default: "true"

concurrency:
  group: duval-pipeline
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_DIR: ${{ github.workspace }}/.data
  NODE_OPTIONS: --max-old-space-size=6144
  SUNBIZ_WINDOW_DAYS: "14"
  PERMITS_WINDOW: "300"
  PA_DETAIL_WINDOW: "300"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Restore source artifacts + DuckDB from the previous run
        uses: actions/cache/restore@v4
        with:
          # one stable path entry: GitHub derives the cache version from the path list, so a changed
          # list would orphan every earlier cache (restore-keys cannot cross versions)
          path: .data
          key: duval-data-${{ github.run_id }}
          restore-keys: |
            duval-data-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Egress check (COJ / DBPR / JaxEPICS answer only from US IPs; FDOR, JTA, NHD, Overture, Sunbiz do not care)
        run: curl -s --max-time 10 https://ipinfo.io/json | head -c 300; echo

      - name: Run pipeline (all tracks)
        env:
          TRACKS: ${{ github.event.inputs.tracks || 'default' }}
          WINDOW: ${{ github.event.inputs.window || '' }}
        run: |
          ARGS="--tracks $TRACKS --trigger ${{ github.event_name }}"
          if [ -n "$WINDOW" ]; then ARGS="$ARGS --window $WINDOW"; fi
          pnpm run pipeline -- $ARGS

      - name: Export open-data consolidation (changed properties only; rebuilds shards/index/manifest)
        run: pnpm run export:consolidation -- --since changed --shard-size 10000

      - name: Publish to Filebase / IPFS (dry-run when secrets are absent)
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET_DUVAL: ${{ secrets.FILEBASE_BUCKET_DUVAL }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [ -n "$FILEBASE_ACCESS_KEY" ] && [ "$PUBLISH" = "true" ]; then
            pnpm run publish:open-data -- --publish
            pnpm run publish:ipfs -- --publish
          else
            echo "Filebase secrets not configured (or publish=false): dry-run only"
            pnpm run publish:open-data
            pnpm run publish:ipfs
          fi

      - name: Save source artifacts + DuckDB for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          # one stable path entry: GitHub derives the cache version from the path list, so a changed
          # list would orphan every earlier cache (restore-keys cannot cross versions)
          path: .data
          key: duval-data-${{ github.run_id }}

      - name: Upload publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duval-publish-${{ github.run_id }}
          # the exclusion needs /** : a bare directory path excludes nothing, so the glob walked all
          # 404k per-property files and upload-artifact died with "Maximum call stack size exceeded".
          # The per-property files are published to IPFS by CID, not shipped as a build artifact.
          path: |
            .data/artifacts/publish/duval/
            !.data/artifacts/publish/duval/open-data/properties/**
            !.data/artifacts/publish/duval/open-data/shards/**
            .data/artifacts/permits/discovered-api.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit run history
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "duval-oracle-pipeline[bot]"
          git config user.email "pipeline@users.noreply.github.com"
          mkdir -p runs
          cp .data/artifacts/publish/duval/publish-manifest.json runs/latest-publish-manifest.json 2>/dev/null || true
          cp .data/artifacts/publish/duval/dataset-coverage.json runs/latest-dataset-coverage.json 2>/dev/null || true
          cp .data/artifacts/permits/discovered-api.json runs/latest-jaxepics-api.json 2>/dev/null || true
          git add runs/
          if git diff --cached --quiet; then echo "no run history changes"; exit 0; fi
          git commit -m "pipeline: run history $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
