name: publish-artifacts

# Publish ONLY the small artifacts the hosted runtime reads: query-table.parquet, the coverage
# snapshot, run history, the entity tables, the catalog and the artifacts index. About ten objects.
#
# This exists because the open-data publish uploads 404k per-property files and takes hours, while
# the runtime needs none of them. Running this gets the gateway and IPNS URLs for the UI in minutes
# without re-ingesting anything: it restores the working set from the pipeline's cache and publishes
# what is already on disk.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really upload (false = dry run, prints CIDs only)"
        required: false
        default: "true"

# Deliberately NOT in the duval-pipeline concurrency group: the point is to run while a long
# open-data upload is in flight. It writes different objects, and IPNS pointing is last-write-wins.
permissions:
  contents: read

env:
  DATA_DIR: ${{ github.workspace }}/.data
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pipeline/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Restore the working set the pipeline already built
        uses: actions/cache/restore@v4
        with:
          # same single path the pipeline saves under, so this reads the newest entry
          path: .data
          key: duval-data-${{ github.run_id }}
          restore-keys: |
            duval-data-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fail early if the cache had no query table
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f .data/artifacts/publish/duval/query-table.parquet ]; then
            echo "::error::No query-table.parquet in the restored cache. Run the pipeline workflow first."
            exit 1
          fi
          ls -la .data/artifacts/publish/duval/

      - name: Publish artifacts to Filebase / IPFS
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET_DUVAL: ${{ secrets.FILEBASE_BUCKET_DUVAL }}
          PUBLISH_RETENTION_DAYS: ${{ vars.PUBLISH_RETENTION_DAYS }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [ -n "$FILEBASE_ACCESS_KEY" ] && [ "$PUBLISH" = "true" ]; then
            pnpm run publish:ipfs -- --publish
          else
            echo "no Filebase secrets, or publish=false: dry run"
            pnpm run publish:ipfs
          fi

      # Same step as in pipeline.yml. The publish above minted a new CID for the query table, and the MCP deployment is bound to
      # a CID on purpose (DuckDB pins the ETag of the URL it opened, so a mutable name breaks every
      # warm instance the moment it moves). Until 2026-08-25 the "re-apply these lines" note in
      # mcp-env.txt was the whole mechanism; nobody re-applied them for three days, storage
      # retention dropped the object, and the MCP answered 504. This step is the mechanism now:
      # it upserts the two per-publish settings on the Vercel project, redeploys it, and fails the
      # job unless the redeployed server answers a real query. Superseded CIDs stay served for
      # PUBLISH_RETENTION_DAYS, so even a failure here degrades to stale data, not to an outage.
      - name: Apply this publish's CID URLs to the MCP deployment and verify it
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          MCP_VERCEL_PROJECT_ID: ${{ vars.MCP_VERCEL_PROJECT_ID }}
          MCP_URL: ${{ vars.MCP_URL }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [ -z "$FILEBASE_ACCESS_KEY" ] || [ "$PUBLISH" != "true" ]; then
            echo "dry run: nothing was published, nothing to apply"
          elif [ -z "$VERCEL_TOKEN" ] || [ -z "$MCP_VERCEL_PROJECT_ID" ]; then
            echo "::warning title=MCP not re-pointed::VERCEL_TOKEN secret or MCP_VERCEL_PROJECT_ID variable is not set, so the MCP deployment still reads the previous query table CID. It keeps working for PUBLISH_RETENTION_DAYS (default 3); paste runs/latest-mcp-env.txt into the deployment, or set the secret and variable so this step does it."
          else
            pnpm run publish:apply-mcp-env
          fi

      - name: Print the env block to set on Vercel
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          # mcp-env.txt is written by the publish itself and is the single source of truth for the
          # MCP deployment's configuration. The two per-publish lines are immutable CID URLs; the
          # step above applies them to the deployment, this is the record of what it applied (and
          # the fallback to paste by hand if that step was skipped). Same values as the published
          # catalog, by construction.
          echo "=== mcp-env.txt (paste into the MCP deployment) ==="
          cat .data/artifacts/publish/duval/mcp-env.txt
          {
            echo "## MCP configuration for this publish"
            echo ""
            echo '```dotenv'
            cat .data/artifacts/publish/duval/mcp-env.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-manifest-${{ github.run_id }}
          path: |
            .data/artifacts/publish/duval/publish-manifest.json
            .data/artifacts/publish/duval/mcp-env.txt
            .data/artifacts/publish/duval/published-counties.json
          if-no-files-found: warn
