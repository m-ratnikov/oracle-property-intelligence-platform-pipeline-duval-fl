name: probe-sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Egress + reachability
        run: |
          curl -s --max-time 10 https://ipinfo.io/json | head -c 200; echo
          for u in \
            "https://paopropertysearch.coj.net/Basic/Search.aspx" \
            "https://maps.coj.net/coj/rest/services/CityBiz/Parcels/MapServer/0?f=pjson" \
            "https://maps.coj.net/coj/rest/services/ERAT/EratDashboard_3000/MapServer/41?f=pjson" \
            "https://www.jacksonville.gov/departments/property-appraiser/data-offerings" \
            "https://jaxepics.coj.net/Permit/View/B-25-279425.000" \
            "https://www2.myfloridalicense.com/sto/file_download/extracts/cilb_certified.csv" \
            "https://floridarevenue.com/property/Pages/DataPortal.aspx" ; do
            curl -s -o /dev/null -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -w "%{http_code} %{time_total}s %{size_download}B $u\n" --max-time 25 "$u" || echo "ERR $u"
          done
      - name: Sample PA detail page (roof fields?)
        run: |
          mkdir -p out
          curl -s -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" --max-time 30 "https://paopropertysearch.coj.net/Basic/Detail.aspx?RE=0000010005R" -o out/detail_0000010005R.html -w "detail %{http_code} %{size_download}B\n"
          curl -s -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" --max-time 30 "https://paopropertysearch.coj.net/Basic/Detail.aspx?RE=0604480000" -o out/detail_0604480000.html -w "detail2 %{http_code} %{size_download}B\n"
          python3 - <<'PY'
          import re,glob
          for f in glob.glob('out/*.html'):
              h=open(f,encoding='utf-8',errors='ignore').read()
              txt=re.sub(r'<[^>]+>',' ',h); txt=re.sub(r'\s+',' ',txt)
              print('==',f,len(h))
              for kw in ['Roof','Year Built','Effective','Sale','Owner','Mailing','Heating','Stories','Baths','Exterior Wall','Element','Building']:
                  for m in list(re.finditer(kw,txt))[:2]:
                      print('  ',kw,'->',txt[max(0,m.start()-40):m.start()+140])
          PY
      - name: JaxEPICS bundle API discovery
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p out
          curl -s -A "$UA" --max-time 30 "https://jaxepics.coj.net/" -o out/jaxepics_index.html -w "index %{http_code} %{size_download}B\n"
          for js in $(grep -oE 'src="[^"]+\.js"' out/jaxepics_index.html | sed -E 's/src="//;s/"//' ); do
            case "$js" in http*) u="$js";; /*) u="https://jaxepics.coj.net$js";; *) u="https://jaxepics.coj.net/$js";; esac
            n=$(basename "$js"); curl -s -A "$UA" --max-time 60 "$u" -o "out/$n" -w "$n %{http_code} %{size_download}B\n"
          done
          echo "--- api literals ---"
          cat out/*.js 2>/dev/null | grep -oE '(https?://[a-z0-9.-]*coj\.net[^"'"'"' ]{0,80}|/api/[A-Za-z0-9_/{}.-]{2,80}|api/[A-Za-z]+/[A-Za-z0-9_/{}.-]{2,60})' | sort | uniq -c | sort -rn | head -80
          echo "--- candidate endpoints ---"
          for u in "https://jaxepicsapi.coj.net/api/Permit/View/B-25-279425.000" "https://jaxepicsapi.coj.net/api/permit/B-25-279425.000" "https://jaxepicsapi.coj.net/api/Permit/B-25-279425.000" "https://jaxepicsapi.coj.net/api/Permit/GetPermit?permitNumber=B-25-279425.000" "https://jaxepicsapi.coj.net/api/Permits/B-25-279425.000" "https://jaxepicsapi.coj.net/api/Permit/Search?permitNumber=B-25-279425.000"; do
            curl -s -A "$UA" --max-time 20 -o out/resp.json -w "%{http_code} %{size_download}B $u
" "$u"; head -c 300 out/resp.json; echo
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pa-detail-sample
          path: out/
