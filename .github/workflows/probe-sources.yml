name: probe-sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
    steps:
      - name: Egress + reachability
        run: |
          curl -s --max-time 10 https://ipinfo.io/json | head -c 200; echo
          for u in \
            "https://paopropertysearch.coj.net/Basic/Search.aspx" \
            "https://maps.coj.net/coj/rest/services/CityBiz/Parcels/MapServer/0?f=pjson" \
            "https://jaxepics.coj.net/Permit/View/B-25-279425.000" \
            "https://www2.myfloridalicense.com/sto/file_download/extracts/cilb_certified.csv" ; do
            curl -s -o /dev/null -A "$UA" -w "%{http_code} %{time_total}s %{size_download}B $u" --max-time 25 "$u" || echo "ERR $u"; echo
          done
      - name: JaxEPICS bundle API discovery
        run: |
          mkdir -p out
          curl -s -A "$UA" --max-time 30 "https://jaxepics.coj.net/" -o out/jaxepics_index.html
          echo "index bytes: $(wc -c < out/jaxepics_index.html)"
          grep -oE 'src="[^"]+\.js"' out/jaxepics_index.html | sed -E 's/src="//;s/"//' > out/js_list.txt
          cat out/js_list.txt
          while read -r js; do
            case "$js" in
              http*) u="$js";;
              /*) u="https://jaxepics.coj.net$js";;
              *) u="https://jaxepics.coj.net/$js";;
            esac
            n=$(basename "$js")
            curl -s -A "$UA" --max-time 90 "$u" -o "out/$n"
            echo "$n bytes: $(wc -c < "out/$n")"
          done < out/js_list.txt
          echo "--- host literals ---"
          cat out/*.js | grep -oE 'https?://[a-zA-Z0-9.-]*coj\.net[^"'"'"' ]{0,120}' | sort | uniq -c | sort -rn | head -40
          echo "--- api path literals ---"
          cat out/*.js | grep -oE '(/api/[A-Za-z0-9_/{}.$-]{2,100}|api/[A-Za-z][A-Za-z0-9_/{}.$-]{2,100})' | sort | uniq -c | sort -rn | head -120
          echo "--- permit-ish literals ---"
          cat out/*.js | grep -oiE '[a-z0-9_/{}.$-]{0,40}permit[a-z0-9_/{}.$-]{0,60}' | sort | uniq -c | sort -rn | head -60
      - name: Candidate endpoints
        run: |
          mkdir -p out
          for u in \
            "https://jaxepicsapi.coj.net/api/Permit/View/B-25-279425.000" \
            "https://jaxepicsapi.coj.net/api/permit/B-25-279425.000" \
            "https://jaxepicsapi.coj.net/api/Permit/B-25-279425.000" \
            "https://jaxepicsapi.coj.net/api/Permit/GetPermit?permitNumber=B-25-279425.000" \
            "https://jaxepicsapi.coj.net/api/Permits/B-25-279425.000" \
            "https://jaxepicsapi.coj.net/api/Permit/Search?permitNumber=B-25-279425.000" \
            "https://jaxepicsapi.coj.net/api/Permit/View/3ee90c" \
            "https://jaxepicsapi.coj.net/swagger/v1/swagger.json" \
            "https://jaxepicsapi.coj.net/swagger/index.html" ; do
            code=$(curl -s -A "$UA" --max-time 20 -o out/resp.bin -w "%{http_code}" "$u")
            echo "$code $(wc -c < out/resp.bin)B $u"
            head -c 300 out/resp.bin; echo
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jaxepics-probe
          path: out/
      - name: DBPR CILB extract layout (headerless; column positions are the only contract)
        run: |
          mkdir -p out
          for n in cilb_certified cilb_registered; do
            echo "=== $n ==="
            curl -s -A "$UA" --max-time 300 -r 0-400000 \
              "https://www2.myfloridalicense.com/sto/file_download/extracts/$n.csv" -o "out/$n.head"
            echo "--- first 6 lines ---"
            head -6 "out/$n.head"
            echo "--- field count of first 5 lines (naive comma split) ---"
            head -5 "out/$n.head" | awk -F',' '{print NR": "NF" fields"}'
            echo "--- lines mentioning DUVAL or JACKSONVILLE in this prefix ---"
            grep -m 3 -iE 'duval|jacksonville' "out/$n.head" || echo "none in first 400KB"
          done
