name: ci

# Tests for the whole repository, on every push and pull request.
#
# Before this existed, CI ran `pnpm test` for pipeline/ only, inside the 40-minute ingestion
# workflow. ui/ has its own unit suite and a Playwright smoke suite, and neither had ever run in CI,
# so a UI regression could only be found by a human loading the deployed site. Typechecking was in
# the same position: both packages have the script, nothing invoked it.
#
# The two packages have separate lockfiles and no workspace root, so they are separate jobs and each
# installs from its own directory.
#
# Required checks are pipeline (typecheck + unit), ui (typecheck + unit) and ui (build). The
# Playwright smoke job is reported and does not block; the reasoning, and what would retire it, is
# on the job itself.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "runs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline (typecheck + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pipeline/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm test

  ui:
    name: ui (typecheck + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        # Called directly rather than through a script name, so this keeps working whether the
        # package calls it `lint` or `typecheck`.
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test

  # The production build is its own check, because it is the one thing here that says "this code
  # compiles" and it must be able to turn CI red. It used to run only inside the smoke job below,
  # which carries continue-on-error, so a `next build` that did not compile could not fail CI at
  # all. Blocking on the build and not blocking on a browser suite are two different decisions and
  # they now live in two different jobs.
  ui-build:
    name: ui (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        # `build` also runs the assets script that copies the DuckDB-WASM bundles into public/, so a
        # missing or renamed asset fails here rather than in a browser.
        run: pnpm run build

  ui-e2e:
    name: ui (playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only worth a browser download once the build is known to compile, and skipped outright when it
    # does not, which is also what stops this job from reporting a build failure as a suite failure.
    needs: ui-build
    # Reported, never blocking, and this is now the ONLY thing the exemption covers. The suite
    # drives a real production build with a 33 MB DuckDB-WASM download over the network, which is
    # the flakiness this was granted for.
    #
    # It has since been green in every CI run that reached it (18 specs, about 50 seconds), so the
    # exemption is now unearned rather than justified. Before removing it: ten consecutive green
    # runs across more than one day, and no test passing on its retry in any of them, which the
    # uploaded HTML report marks as flaky. `retries: 1` in playwright.config.ts absorbs exactly the
    # single-attempt flake this exemption exists for, so that count has to come from the report and
    # not from the job conclusion.
    continue-on-error: true
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        # Built again rather than carried over from ui-build: playwright.config.ts starts the suite
        # with `next start`, which needs .next on this runner, and a Next build output is larger and
        # slower to move between jobs than it is to produce.
        run: pnpm run build
      - name: Smoke suite
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
